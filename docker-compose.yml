version: '3.8'

services:
  # Project 1: RAG Policy Advisor (includes evaluator)
  rag-advisor:
    build: 
      context: ./01-rag-policy-advisor
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_BASE=https://api.groq.com/openai/v1
    volumes:
      - ./01-rag-policy-advisor/data:/app/data
    restart: unless-stopped

  # Project 4: Email Triage Agent
  email-agent:
    build: 
      context: ./04-email-triage-agent
    ports:
      - "8004:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_BASE=https://api.groq.com/openai/v1
    restart: unless-stopped
