name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linter
        run: pip install ruff
      - name: Lint all Python files
        run: ruff check --select E,F,W --ignore E501 .

  test-rag:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-rag-policy-advisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run RAG tests
        run: python -m pytest tests/ -v

  test-email:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-email-triage-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run Email Triage tests
        run: python -m pytest tests/ -v
